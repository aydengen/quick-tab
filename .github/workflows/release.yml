# GitHub Actions - 自动构建和发布
#
# 触发条件:
#   - 推送 tag (v*)
#   - 手动触发
#
# 功能:
#   1. 自动构建 zip 包
#   2. 创建 GitHub Release
#   3. (可选) 发布到 Chrome Web Store

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.1)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: 构建和发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 获取版本号
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 版本: $VERSION"

      - name: 构建扩展
        run: |
          MANIFEST_VERSION=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' manifest.json)
          RELEASE_VERSION="${{ steps.version.outputs.version }}"
          ZIP_PATH="releases/quick-tab-v${RELEASE_VERSION}.zip"

          if [ "$MANIFEST_VERSION" != "$RELEASE_VERSION" ]; then
            echo "❌ manifest.json 版本 ($MANIFEST_VERSION) 与发布版本 ($RELEASE_VERSION) 不一致"
            exit 1
          fi

          mkdir -p releases
          rm -f "$ZIP_PATH"
          zip -qr "$ZIP_PATH" manifest.json background.js content.js content.css icons/icon_32.png icons/icon_36.png icons/icon_48.png icons/icon_128.png

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: quick-tab-v${{ steps.version.outputs.version }}
          path: releases/quick-tab-v${{ steps.version.outputs.version }}.zip
          retention-days: 30

      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: releases/quick-tab-v${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Chrome Web Store 自动发布
      - name: 发布到 Chrome Web Store
        if: startsWith(github.ref, 'refs/tags/')
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: releases/quick-tab-v${{ steps.version.outputs.version }}.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          refresh-token: ${{ secrets.REFRESH_TOKEN }}
          publish: true
