# GitHub Actions - CI 持续集成
#
# 触发条件:
#   - 推送到 main 分支
#   - Pull Request 到 main 分支
#
# 功能:
#   1. 验证构建是否成功
#   2. 检查 manifest.json 格式

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 验证 manifest.json
        run: |
          echo "📋 验证 manifest.json..."
          node -e "
            const manifest = require('./manifest.json');
            const required = ['manifest_version', 'name', 'version'];
            for (const key of required) {
              if (!manifest[key]) {
                console.error('❌ 缺少必需字段:', key);
                process.exit(1);
              }
            }
            if (manifest.manifest_version !== 3) {
              console.error('❌ manifest_version 必须是 3');
              process.exit(1);
            }
            console.log('✅ manifest.json 验证通过');
            console.log('   名称:', manifest.name);
            console.log('   版本:', manifest.version);
          "
      
      - name: 构建扩展
        run: ./scripts/build.sh --zip
      
      - name: 检查构建产物
        run: |
          if [ -f releases/*.zip ]; then
            echo "✅ ZIP 文件已生成"
            ls -la releases/
          else
            echo "❌ ZIP 文件未生成"
            exit 1
          fi
