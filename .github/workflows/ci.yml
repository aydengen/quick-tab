# GitHub Actions - CI 持续集成
#
# 触发条件:
#   - 推送到 main 分支
#   - Pull Request 到 main 分支
#
# 功能:
#   1. 验证构建是否成功
#   2. 检查 manifest.json 格式

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: 构建检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 验证 manifest.json
        run: |
          echo "📋 验证 manifest.json..."
          python3 - <<'PY'
          import json
          import sys

          with open('manifest.json', 'r', encoding='utf-8') as f:
              manifest = json.load(f)

          required = ['manifest_version', 'name', 'version']
          for key in required:
              if not manifest.get(key):
                  print(f'❌ 缺少必需字段: {key}', file=sys.stderr)
                  sys.exit(1)

          if manifest['manifest_version'] != 3:
              print('❌ manifest_version 必须是 3', file=sys.stderr)
              sys.exit(1)

          print('✅ manifest.json 验证通过')
          print(f"   名称: {manifest['name']}")
          print(f"   版本: {manifest['version']}")
          PY

      - name: 构建扩展
        run: |
          VERSION=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' manifest.json)
          ZIP_PATH="releases/quick-tab-v${VERSION}.zip"

          mkdir -p releases
          rm -f "$ZIP_PATH"
          zip -qr "$ZIP_PATH" manifest.json background.js content.js content.css icons/icon_32.png icons/icon_36.png icons/icon_48.png icons/icon_128.png

      - name: 检查构建产物
        run: |
          VERSION=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' manifest.json)
          ZIP_PATH="releases/quick-tab-v${VERSION}.zip"

          if [ -f "$ZIP_PATH" ]; then
            echo "✅ ZIP 文件已生成"
            ls -la "$ZIP_PATH"
          else
            echo "❌ ZIP 文件未生成"
            exit 1
          fi
