<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickTab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="quicktab-popup">
    <h1 class="quicktab-title"><img src="icons/icon_128.png" width="28" height="28" alt="">QuickTab</h1>
    <div class="quicktab-setting">
      <label class="quicktab-option">
        <span>Sticky panel mode</span>
        <input type="checkbox" role="switch" id="stickyMode" aria-describedby="stickyModeHint">
      </label>
      <p class="quicktab-hint" id="stickyModeHint">Panel stays open without holding Alt. Use <kbd>j</kbd>/<kbd>k</kbd> or arrows to navigate, <kbd>Enter</kbd> to switch.</p>
    </div>

    <div class="quicktab-setting">
      <label class="quicktab-option">
        <span>Show non-switchable tabs</span>
        <input type="checkbox" role="switch" id="showNonInjectable" aria-describedby="showNonInjectableHint">
      </label>
      <p class="quicktab-hint" id="showNonInjectableHint">Include chrome://, Web Store and other restricted pages in the tab list.</p>
    </div>

    <a class="quicktab-guide" href="onboarding.html" target="_blank" rel="noopener">Quick start guide <span aria-hidden="true">↗</span></a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
